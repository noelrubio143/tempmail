services:
  inbucket:
    image: inbucket/inbucket:latest
    container_name: inbucket
    restart: always
    ports:
      - "25:2500"
    environment:
      INBUCKET_STORAGE_RETENTIONPERIOD: ${RETENTION:-1h}
      INBUCKET_STORAGE_MAILBOXMSGCAP: "100"
      INBUCKET_SMTP_DEFAULTACCEPT: "true"
      INBUCKET_SMTP_DEFAULTSTORE: "true"

  web:
    image: nginx:alpine
    container_name: tempmail-web
    restart: always
    depends_on:
      - inbucket
      - chat
    ports:
      - "9000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./config.js:/usr/share/nginx/html/config.js:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  chat:
    image: node:20-alpine
    container_name: tempmail-chat
    restart: always
    working_dir: /app
    command: node chat.js
    volumes:
      - ./chat.js:/app/chat.js:ro
