<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temp Mail</title>
<style>
:root{--bg:#0f1419;--card:#18202a;--line:#263241;--text:#e7edf4;--mute:#8b9bb0;--acc:#4da3ff;--acc2:#2f7fd6;--ok:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 14px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.addr{display:flex;gap:8px;align-items:center;background:#0c1117;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.addr b{flex:1;font-size:17px;word-break:break-all}
button{font:inherit;color:var(--text);background:#223044;border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc2);border-color:var(--acc2)}
button.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.custom{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.custom .in{flex:1;min-width:200px;display:flex;align-items:center;background:#0c1117;border:1px solid var(--line);border-radius:10px;padding:0 12px}
.custom input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;padding:10px 0;outline:none}
.custom span{color:var(--mute)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hd small{color:var(--mute)}
.msg{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 4px}
.msg:first-of-type{border-top:0}
.msg.new .sub{font-weight:700}
.msg .from{color:var(--acc);font-size:13px;word-break:break-all}
.msg .sub{margin:2px 0}
.msg .dt{color:var(--mute);font-size:12px}
.empty{color:var(--mute);text-align:center;padding:26px 0}
.view h2{font-size:17px;margin:0 0 6px;word-break:break-word}
.meta{color:var(--mute);font-size:13px;margin-bottom:10px;word-break:break-all}
iframe{width:100%;height:55vh;border:1px solid var(--line);border-radius:10px;background:#fff}
pre{white-space:pre-wrap;word-break:break-word;background:#0c1117;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0}
.att a{color:var(--acc)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.hidden{display:none!important}

.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:13px 10px;font-size:16px;font-weight:600;position:relative;background:var(--card)}
.tabs button.on{background:var(--acc2);border-color:var(--acc2)}
.tabs i{position:absolute;top:-6px;right:-4px;background:var(--bad);color:#fff;font:700 11px/18px system-ui;min-width:18px;border-radius:9px;text-align:center;font-style:normal}
.chat{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:380px}
.chat .top{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat .top b{flex:1}
.chat .top input{width:130px;background:#0c1117;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 9px;font:inherit;font-size:14px}
.chat .log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cm{font-size:15px;word-break:break-word}
.cm b{color:var(--acc)} .cm.me b{color:var(--ok)} .cm small{color:var(--mute);margin-left:6px;font-size:11px}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat form input{flex:1;min-width:0;background:#0c1117;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px 12px;font:inherit;outline:none}

.tabs button{padding:12px 6px;font-size:15px}
#tv{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;display:block}
.tvst{color:var(--mute);font-size:13px;margin:8px 0;min-height:18px;word-break:break-word}
.tvst.bad{color:var(--bad)}
.tvbar{display:flex;gap:8px;margin:10px 0}
.tvbar select,.tvbar input{background:#0c1117;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px;font:inherit;min-width:0}
.tvbar select{flex:1}.tvbar input{flex:1}
.chl{max-height:50vh;overflow-y:auto;border-top:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:9px 4px}
.ch img{width:36px;height:36px;object-fit:contain;background:#0c1117;border-radius:6px;flex:none}
.ch .ph{width:36px;height:36px;border-radius:6px;background:#0c1117;flex:none;text-align:center;line-height:36px}
.ch span{flex:1;word-break:break-word}.ch small{color:var(--mute)}
.ch.on{background:#1d2b3c}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button id="tabMail" class="on">📬 Temp Mail</button>
    <button id="tabChat">💬 Chat<i id="chatBadge" class="hidden">0</i></button>
    <button id="tabTv">📺 IPTV</button>
  </div>

  <div id="mailView">

  <div class="card">
    <div class="addr"><b id="addr">…</b><button id="copy">Kopyahin</button></div>
    <div class="row">
      <button class="pri" id="rand">🎲 Random na email</button>
      <button id="refresh">↻ Refresh</button>
    </div>
    <div class="custom">
      <div class="in"><input id="name" placeholder="sariling pangalan" maxlength="40" autocapitalize="none" autocomplete="off" spellcheck="false"><span id="dom"></span></div>
      <button id="create">Gamitin</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="card" id="listCard">
    <div class="hd"><div><span class="dot"></span><b>Inbox</b></div><small id="status">auto-refresh 5s</small></div>
    <div id="list"></div>
    <div class="row hidden" id="purgeRow"><button class="bad" id="purge">Burahin lahat</button></div>
  </div>

  <div class="card view hidden" id="viewCard">
    <div class="row" style="margin:0 0 10px"><button id="back">← Bumalik</button><button class="bad" id="del">Burahin</button></div>
    <h2 id="vsub"></h2>
    <div class="meta" id="vmeta"></div>
    <div id="vbody"></div>
    <div class="att" id="vatt"></div>
  </div>
  </div>

  <div class="chat hidden" id="chatView">
    <div class="top"><b>💬 Chat room</b><input id="nick" maxlength="20" placeholder="pangalan"></div>
    <div class="log" id="clog"></div>
    <form id="cform"><input id="ctext" maxlength="300" placeholder="Mag-type ng mensahe…" autocomplete="off"><button class="pri">Send</button></form>
  </div>

  <div class="card hidden" id="tvView">
    <video id="tv" controls playsinline></video>
    <div class="tvst" id="tvst">Pumili ng channel sa ibaba.</div>
    <div class="tvbar">
      <select id="tvSrc">
        <optgroup label="Bansa">
          <option value="countries/ph">🇵🇭 Pilipinas</option><option value="countries/us">🇺🇸 USA</option><option value="countries/gb">🇬🇧 UK</option>
          <option value="countries/jp">🇯🇵 Japan</option><option value="countries/kr">🇰🇷 Korea</option><option value="countries/in">🇮🇳 India</option>
          <option value="countries/sg">🇸🇬 Singapore</option><option value="countries/au">🇦🇺 Australia</option><option value="countries/ca">🇨🇦 Canada</option>
        </optgroup>
        <optgroup label="Kategorya">
          <option value="categories/news">News</option><option value="categories/sports">Sports</option><option value="categories/movies">Movies</option>
          <option value="categories/kids">Kids</option><option value="categories/music">Music</option><option value="categories/entertainment">Entertainment</option>
          <option value="categories/documentary">Documentary</option><option value="categories/animation">Animation</option><option value="categories/series">Series</option>
        </optgroup>
      </select>
      <input id="tvQ" placeholder="hanapin…" autocomplete="off">
    </div>
    <div class="chl" id="chl"></div>
    <div class="tvst">Public na streams galing sa <a style="color:var(--acc)" href="https://github.com/iptv-org/iptv" target="_blank" rel="noopener">iptv-org</a>. May ilang channel na hindi gumagana o nagbabago.</div>
  </div>
</div>



<script src="config.js"></script>
<script>
const DOMAIN = window.TEMPMAIL_DOMAIN || location.hostname;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ADJ = ["swift","happy","lucky","brave","calm","cool","wild","tiny","bold","quiet","sunny","clever","witty","merry","fuzzy","mighty","jolly","nimble","royal","cosmic"];
const NOUN = ["tiger","panda","falcon","mango","comet","river","maple","otter","pixel","rocket","lotus","cobra","eagle","ember","koala","breeze","delta","orbit","tarsier","carabao"];
const pick = a => a[Math.floor(Math.random()*a.length)];
const randName = () => pick(ADJ)+pick(NOUN)+(Math.floor(Math.random()*9000)+100);
const valid = n => /^[a-z0-9][a-z0-9._-]{0,38}[a-z0-9]$|^[a-z0-9]$/.test(n);

let box = "", openId = null, timer = null;
const seen = new Set();

function setBox(n){
  box = n; openId = null;
  try { localStorage.setItem("tm_box", n); } catch(e){}
  $("addr").textContent = n + "@" + DOMAIN;
  $("viewCard").classList.add("hidden");
  $("listCard").classList.remove("hidden");
  $("err").textContent = "";
  load();
}
async function api(path, opt){
  const r = await fetch(path, opt);
  if(!r.ok) throw new Error(r.status);
  return r.status===204 ? null : r.json().catch(()=>null);
}
function fmt(d){ const t=new Date(d); return isNaN(t)?"":t.toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }

async function load(){
  if(!box) return;
  const my = box;
  try{
    const list = await api("/api/v1/mailbox/"+encodeURIComponent(my));
    if(my!==box) return;
    $("status").textContent = "auto-refresh 5s";
    list.sort((a,b)=> new Date(b.date)-new Date(a.date));
    $("purgeRow").classList.toggle("hidden", !list.length);
    $("list").innerHTML = list.length ? list.map(m=>`
      <button class="msg ${m.seen||seen.has(m.id)?"":"new"}" data-id="${esc(m.id)}">
        <div class="from">${esc(m.from)}</div>
        <div class="sub">${esc(m.subject||"(walang subject)")}</div>
        <div class="dt">${esc(fmt(m.date))}</div>
      </button>`).join("") : '<div class="empty">Wala pang mail. Ipadala sa address sa itaas at lalabas dito.</div>';
  }catch(e){ $("status").textContent = "hindi maabot ang server"; }
}

async function openMsg(id){
  try{
    const m = await api(`/api/v1/mailbox/${encodeURIComponent(box)}/${encodeURIComponent(id)}`);
    openId = id; seen.add(id);
    $("vsub").textContent = m.subject || "(walang subject)";
    $("vmeta").textContent = "Mula: " + (m.from||"") + " · " + fmt(m.date);
    const b = m.body || {};
    $("vbody").innerHTML = "";
    if(b.html){
      const f = document.createElement("iframe");
      f.setAttribute("sandbox","");           // walang script
      f.srcdoc = '<base target="_blank">'+b.html;
      $("vbody").appendChild(f);
    } else {
      const p = document.createElement("pre"); p.textContent = b.text || "(walang laman)";
      $("vbody").appendChild(p);
    }
    $("vatt").innerHTML = (m.attachments||[]).length
      ? "<p>Attachments:</p>"+m.attachments.map(a=>`<div><a target="_blank" rel="noopener" href="/serve/mailbox/${encodeURIComponent(box)}/${encodeURIComponent(id)}/${encodeURIComponent(a["id"]||"")}/${encodeURIComponent(a["file-name"]||"file")}">${esc(a["file-name"]||"file")}</a></div>`).join("")
      : "";
    $("listCard").classList.add("hidden");
    $("viewCard").classList.remove("hidden");
    scrollTo(0,0);
  }catch(e){ $("err").textContent = "Hindi mabuksan ang mensahe."; }
}

$("dom").textContent = "@"+DOMAIN;
$("list").addEventListener("click", e=>{ const b=e.target.closest(".msg"); if(b) openMsg(b.dataset.id); });
$("back").onclick = ()=>{ openId=null; $("viewCard").classList.add("hidden"); $("listCard").classList.remove("hidden"); load(); };
$("del").onclick = async ()=>{ if(!openId) return; try{ await api(`/api/v1/mailbox/${encodeURIComponent(box)}/${encodeURIComponent(openId)}`,{method:"DELETE"}); }catch(e){} $("back").onclick(); };
$("purge").onclick = async ()=>{ if(!confirm("Burahin lahat ng mail sa inbox na ito?")) return; try{ await api("/api/v1/mailbox/"+encodeURIComponent(box),{method:"DELETE"}); }catch(e){} load(); };
$("rand").onclick = ()=> setBox(randName());
$("refresh").onclick = load;
$("copy").onclick = async ()=>{ const t=box+"@"+DOMAIN; try{ await navigator.clipboard.writeText(t); }catch(e){ const r=document.createRange(); r.selectNodeContents($("addr")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); } $("copy").textContent="Nakopya ✓"; setTimeout(()=>$("copy").textContent="Kopyahin",1200); };
function create(){
  const n = $("name").value.trim().toLowerCase().replace(/@.*$/,"");
  if(!valid(n)){ $("err").textContent = "Letra, numero, tuldok, _ o - lang (max 40)."; return; }
  $("name").value=""; setBox(n);
}
$("create").onclick = create;
$("name").addEventListener("keydown", e=>{ if(e.key==="Enter") create(); });

let start = ""; try{ start = localStorage.getItem("tm_box")||""; }catch(e){}
setBox(valid(start)?start:randName());
timer = setInterval(()=>{ if(!openId && !document.hidden) load(); }, 5000);

// ---------- Chat ----------
(function(){
  let nick = ""; try{ nick = localStorage.getItem("tm_nick")||""; }catch(e){}
  if(!nick) nick = "guest"+Math.floor(Math.random()*9000+1000);
  $("nick").value = nick;
  $("nick").addEventListener("change", ()=>{ nick = $("nick").value.trim().slice(0,20)||nick; $("nick").value=nick; try{ localStorage.setItem("tm_nick",nick); }catch(e){} });
  let unread = 0, isOpen = false;
  const seenIds = new Set();
  function add(m){
    if(seenIds.has(m.id)) return; seenIds.add(m.id);
    const d = document.createElement("div"); d.className = "cm"+(m.nick===nick?" me":"");
    const b = document.createElement("b"); b.textContent = m.nick;
    const small = document.createElement("small"); small.textContent = new Date(m.t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    d.append(b, small, document.createElement("br"), document.createTextNode(m.text));
    const log = $("clog"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    log.appendChild(d); if(atBottom) log.scrollTop = log.scrollHeight;
  }
  function badge(){ $("chatBadge").textContent = unread>99?"99+":unread; $("chatBadge").classList.toggle("hidden", !unread); }
  function connect(){
    const es = new EventSource("/chat/api/stream");
    es.addEventListener("history", e=>{ JSON.parse(e.data).forEach(add); $("clog").scrollTop = $("clog").scrollHeight; });
    es.onmessage = e=>{ const m = JSON.parse(e.data); const fresh = !seenIds.has(m.id); add(m); if(fresh && !isOpen && m.nick!==nick){ unread++; badge(); } };
  }
  function show(tab){
    isOpen = tab==="chat";
    [["mail","Mail"],["chat","Chat"],["tv","Tv"]].forEach(([t,T])=>{
      $(t+"View").classList.toggle("hidden", t!==tab);
      $("tab"+T).classList.toggle("on", t===tab);
    });
    try{ localStorage.setItem("tm_tab", tab); }catch(e){}
    if(isOpen){ unread=0; badge(); $("clog").scrollTop=$("clog").scrollHeight; $("ctext").focus(); }
    if(tab==="tv"){ window.tvOpen && window.tvOpen(); } else { window.tvStop && window.tvStop(); }
  }
  $("tabMail").onclick = ()=>show("mail");
  $("tabChat").onclick = ()=>show("chat");
  $("tabTv").onclick = ()=>show("tv");
  let t0=""; try{ t0=localStorage.getItem("tm_tab")||""; }catch(e){}
  if(t0==="chat"||t0==="tv") show(t0);
  $("cform").addEventListener("submit", async e=>{
    e.preventDefault(); const t = $("ctext").value.trim(); if(!t) return;
    $("ctext").value = "";
    try{
      const r = await fetch("/chat/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nick,text:t})});
      if(r.status===429){ $("ctext").value = t; }
    }catch(err){ $("ctext").value = t; }
  });
  connect();
})();


// ---------- IPTV ----------
(function(){
  const HLS_URL = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js";
  const video = $("tv"), cache = {};
  let hls = null, channels = [], current = "", started = false, hlsReady = null;
  const st = (t,bad)=>{ $("tvst").textContent=t; $("tvst").classList.toggle("bad",!!bad); };
  function loadHls(){
    if(window.Hls) return Promise.resolve();
    if(hlsReady) return hlsReady;
    return hlsReady = new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=HLS_URL; sc.onload=res; sc.onerror=()=>{hlsReady=null;rej();}; document.head.appendChild(sc); });
  }
  function parse(txt){
    const out=[], L=txt.split(/\r?\n/); let meta=null;
    for(const line of L){
      if(line.startsWith("#EXTINF")){
        meta={ name:(line.split(/,(.*)$/s)[1]||"").trim(),
               logo:(line.match(/tvg-logo="([^"]*)"/)||[])[1]||"",
               group:(line.match(/group-title="([^"]*)"/)||[])[1]||"" };
      } else if(meta && /^https?:\/\//.test(line.trim())){
        meta.url=line.trim(); if(meta.name) out.push(meta); meta=null;
      }
    }
    return out;
  }
  function render(){
    const q=$("tvQ").value.trim().toLowerCase(), box=$("chl"); box.innerHTML="";
    const list = channels.filter(c=>!q||c.name.toLowerCase().includes(q)).slice(0,400);
    if(!list.length){ const d=document.createElement("div"); d.className="empty"; d.textContent="Walang channel."; box.appendChild(d); return; }
    const frag=document.createDocumentFragment();
    list.forEach(c=>{
      const b=document.createElement("button"); b.className="ch"+(c.url===current?" on":"");
      if(c.logo){ const im=document.createElement("img"); im.src=c.logo; im.loading="lazy"; im.referrerPolicy="no-referrer"; im.onerror=()=>{im.replaceWith(Object.assign(document.createElement("div"),{className:"ph",textContent:"📺"}));}; b.appendChild(im); }
      else b.appendChild(Object.assign(document.createElement("div"),{className:"ph",textContent:"📺"}));
      const sp=document.createElement("span"); sp.textContent=c.name; b.appendChild(sp);
      if(c.group){ const sm=document.createElement("small"); sm.textContent=c.group; b.appendChild(sm); }
      b.onclick=()=>play(c);
      frag.appendChild(b);
    });
    box.appendChild(frag);
  }
  async function loadList(){
    const key=$("tvSrc").value;
    st("Kinukuha ang listahan…");
    try{
      if(!cache[key]){
        const r=await fetch("https://iptv-org.github.io/iptv/"+key+".m3u"); if(!r.ok) throw 0;
        cache[key]=parse(await r.text());
      }
      channels=cache[key]; render();
      st(channels.length+" channel. Pumili para manood.");
    }catch(e){ channels=[]; render(); st("Hindi makuha ang listahan. Subukan ulit mamaya.",true); }
  }
  async function play(c){
    current=c.url; render(); st("Nilo-load: "+c.name+"…");
    if(hls){ hls.destroy(); hls=null; }
    video.pause(); video.removeAttribute("src"); video.load();
    try{
      if(/\.m3u8?(\?|$)/i.test(c.url) || true){
        if(video.canPlayType("application/vnd.apple.mpegurl")){ video.src=c.url; }
        else{
          await loadHls();
          if(!window.Hls || !Hls.isSupported()) throw 0;
          hls=new Hls({maxBufferLength:20});
          hls.on(Hls.Events.ERROR,(ev,d)=>{ if(d.fatal){ st("Hindi gumagana ang channel na ito ("+c.name+"). Subukan ang iba.",true); hls&&hls.destroy(); hls=null; } });
          hls.loadSource(c.url); hls.attachMedia(video);
        }
      }
      await video.play().catch(()=>{});
      st("▶ "+c.name);
    }catch(e){ st("Hindi ma-play: "+c.name+". Subukan ang iba.",true); }
  }
  window.tvOpen=()=>{ if(!started){ started=true; loadList(); } };
  window.tvStop=()=>{ try{ video.pause(); }catch(e){} };
  $("tvSrc").onchange=loadList;
  $("tvQ").addEventListener("input",render);
  if(!$("tvView").classList.contains("hidden")) window.tvOpen();
})();
</script>
</body>
</html>
